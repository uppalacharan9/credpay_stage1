pool:
  vmImage: ubuntu-latest

variables:
  acrserviceconnection: 'new_acr_connection'
  frontendrepository: 'credpay/frontend'
  userrepository: 'credpay/user-service'
  paymentrepository: 'credpay/payment-service'
  tag: '$(Build.BuildId)'
stages:
    - stage: terraform
      displayName: terrafrom infra
      jobs:
        - job: terraformapply
          displayName: terraform init & apply
          steps:
            - checkout: self
            - task: TerraformInstaller@1
              inputs:
                terraformVersion: 'latest'
            - task: TerraformTask@5
              inputs:
                provider: 'azurerm'
                command: 'init'
                workingDirectory: terraform
                backendServiceArm: 'Azure subscription 1(3216be10-695a-4fd6-ae65-70140df12a16)'
                backendAzureRmOverrideSubscriptionID: '40f4ed45-fd9a-44dd-aefb-f83446de9465'
                backendAzureRmResourceGroupName: 'Capstone-rg'
                backendAzureRmStorageAccountName: 'credpyproject'
                backendAzureRmContainerName: 'statefile'
                backendAzureRmKey: 'credpyproject.terraform.tfstate'
