stages:
    - stage: terraform
      displayName: terrafrom infra
      jobs:
        - job: terraformapply
          displayName: terraform init & apply
          steps:
            - checkout: self
            - task: TerraformInstaller@1
              inputs:
                terraformVersion: '1.13.3'
            - task: TerraformTask@5
              inputs:
                provider: 'azurerm'
                command: 'init'
                workingDirectory: terraform
                backendServiceArm: 'Azure subscription 1(3216be10-695a-4fd6-ae65-70140df12a16)'
                backendAzureRmOverrideSubscriptionID: '3216be10-695a-4fd6-ae65-70140df12a16'
                backendAzureRmResourceGroupName: 'Capstone-rg'
                backendAzureRmStorageAccountName: 'credpyproject'
                backendAzureRmContainerName: 'statefile'
                backendAzureRmKey: 'credpyproject.terraform.tfstate'
            - task: AzureCLI@3
              inputs:
                connectionType: 'azureRM'
                azureSubscription: 'Azure subscription 1(3216be10-695a-4fd6-ae65-70140df12a16)'
                scriptType: 'bash'
                scriptLocation: 'inlineScript'
                inlineScript: |
                  cd terraform
                  terraform apply -auto-approve
